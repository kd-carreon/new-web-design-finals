<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>LOGIN PAGE</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* BODY */
body{
  height:100vh;
  font-family:'Inter',sans-serif;

  background:
  url("bg.jpg")
  no-repeat center center/cover;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#1a1a1a;

  transition:opacity 1s ease;
}

/* GLASSMORPHIC PARCHMENT CONTAINER */
.container{
  width:380px;

  padding:40px 35px;

  border-radius:20px;

  backdrop-filter:blur(20px);

  background:
  rgba(255,244,214,0.35);

  border:
  1px solid rgba(255,255,255,0.2);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.3);

  position:relative;
  overflow:hidden;
}

/* PARCHMENT TEXTURE */
.container::before{
  content:"";

  position:absolute;
  inset:0;

  background-image:
  url("https://www.transparenttextures.com/patterns/old-map.png");

  opacity:0.25;

  mix-blend-mode:multiply;

  pointer-events:none;
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:30px;
}

.header h1{
  font-family:'Poppins',sans-serif;

  font-size:48px;
  font-weight:800;

  letter-spacing:4px;
}

.header span{
  display:block;

  font-size:14px;

  letter-spacing:3px;

  margin-top:5px;
}

/* INPUTS */
.input-group{
  margin-bottom:20px;
}

label{
  font-size:13px;
  opacity:0.7;

  display:block;

  margin-bottom:6px;
}

input{
  width:100%;

  padding:12px 14px;

  border-radius:10px;

  border:none;
  outline:none;

  background:
  rgba(255,255,255,0.6);

  backdrop-filter:blur(5px);

  font-size:14px;

  transition:0.2s;
}

input:focus{
  background:
  rgba(255,255,255,0.9);

  box-shadow:
  0 0 0 2px rgba(255,180,60,0.5);
}

/* BUTTON */
button{
  width:100%;

  padding:14px;

  border:none;

  border-radius:12px;

  margin-top:10px;

  background:
  linear-gradient(
    135deg,
    #ffb347,
    #ff7e5f
  );

  color:white;

  font-weight:600;
  font-size:15px;

  cursor:pointer;

  transition:0.25s ease;

  position:relative;
}

button:hover{
  box-shadow:
  0 0 20px rgba(255,140,80,0.6);

  transform:
  translateY(-1px);
}

/* LOADING */
.loading{
  display:none;

  text-align:center;

  margin-top:20px;
}

/* LOG POSE */
.logpose{
  width:50px;
  height:50px;

  border:
  4px solid rgba(0,0,0,0.1);

  border-top:
  4px solid #ff7e5f;

  border-radius:50%;

  margin:10px auto;

  animation:
  spin 1s linear infinite;
}

/* SPIN ANIMATION */
@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.loading p{
  font-size:13px;
  opacity:0.7;
}

</style>
</head>

<body>

<!-- LOGIN CONTAINER -->
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>WANTED</h1>
    <span>DEAD OR ALIVE</span>
  </div>

  <!-- FORM -->
  <form id="loginForm">

    <div class="input-group">
      <label>Assign Your Bounty Name</label>

      <input
      type="text"
      required />
    </div>

    <div class="input-group">
      <label>Unlock the Poneglyph</label>

      <input
      type="password"
      required />
    </div>

    <button type="submit">
      Claim the Bounty
    </button>

  </form>

  <!-- LOADING -->
  <div class="loading" id="loading">

    <div class="logpose"></div>

    <p>Calibrating Log Pose...</p>

  </div>

</div>

<!-- SCRIPT -->
<script>

const form =
document.getElementById("loginForm");

const loading =
document.getElementById("loading");

form.addEventListener("submit", function(e){

    e.preventDefault();

    form.style.display = "none";

    loading.style.display = "block";

    setTimeout(() => {

        loading.innerHTML =
        "<p>🏴‍☠️ Bounty Verified! Welcome to the Grand Line.</p>";

        setTimeout(() => {

            window.location.href = "hero-page.html";

        }, 1500);

    }, 2500);

});

</script>

</body>
</html>
