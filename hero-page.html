<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>HERO PAGE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    color:white;
}

/* HERO SECTION */

.hero{
    width:100%;
    height:100vh;

    background:url("hero-bg.jpg") center center/cover no-repeat;

    position:relative;
}

/* DARK OVERLAY */

.hero::after{
    content:"";

    position:absolute;
    inset:0;

    background:linear-gradient(
        90deg,
        rgba(0,0,0,0.78) 20%,
        rgba(0,0,0,0.45) 55%,
        rgba(0,0,0,0.20) 100%
    );
}

/* NAVIGATION */

.nav{
    width:100%;

    position:absolute;
    top:0;
    left:0;

    padding:25px 60px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:2;
}

.logo{
    font-family:'Poppins',sans-serif;

    font-size:16px;
    font-weight:800;

    letter-spacing:2px;
}

.nav ul{
    list-style:none;

    display:flex;
    gap:40px;
}

.nav ul li a{
    text-decoration:none;

    color:white;

    font-size:14px;

    letter-spacing:2px;

    opacity:0.8;

    transition:0.3s ease;
}

.nav ul li a:hover{
    opacity:1;
}

/* CONTENT */

.content{
    position:absolute;

    top:50%;
    left:7%;

    transform:translateY(-50%);

    max-width:600px;

    z-index:2;

    animation:float 6s ease-in-out infinite;
}

.content h1{
    font-family:'Poppins',sans-serif;

    font-size:72px;

    line-height:1;

    font-weight:800;

    margin-bottom:25px;
}

.content p{
    font-size:17px;

    line-height:1.7;

    opacity:0.85;

    margin-bottom:35px;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:20px;
}

/* BUTTON BASE */

.btn{
    padding:15px 32px;

    border-radius:40px;

    text-decoration:none;

    font-size:15px;
    font-weight:600;

    transition:0.3s ease;

    display:inline-block;
}

/* PRIMARY BUTTON */

.btn-primary{
    background:#ff3b3b;
    color:white;
}

.btn-primary:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 20px rgba(255,59,59,0.7);
}

/* SECONDARY BUTTON */

.btn-secondary{

    border:1px solid rgba(255,255,255,0.4);

    color:white;

    background:transparent;
}

.btn-secondary:hover{

    background:rgba(255,255,255,0.10);

    transform:translateY(-3px);
}

/* PAGINATION */

.pagination{

    position:absolute;

    bottom:35px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:12px;

    z-index:2;
}

.page{

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(255,255,255,0.15);

    color:white;

    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:0.3s ease;

    backdrop-filter:blur(5px);

    text-decoration:none;
}

.page:hover{

    transform:translateY(-3px);

    background:#ffd814;
    color:black;

    box-shadow:
    0 8px 20px rgba(255,216,20,0.45);
}

/* ACTIVE PAGE */

.active{

    background:#ffd814;
    color:black;

    box-shadow:
    0 8px 20px rgba(255,216,20,0.45);
}

/* FLOAT ANIMATION */

@keyframes float{

    0%,100%{
        transform:translateY(-50%) translateX(0px);
    }

    50%{
        transform:translateY(-52%) translateX(3px);
    }
}

</style>
</head>

<body>

<section class="hero">

    <!-- NAVIGATION -->

    <nav class="nav">

        <div class="logo">
            THE GRAND LINE
        </div>

        <ul>

            <li>
                <a href="#">
                    THE VOW
                </a>
            </li>

            <li>
                <a href="#">
                    NAKAMA
                </a>
            </li>

            <li>
                <a href="#">
                    THE HORIZON
                </a>
            </li>

        </ul>

    </nav>

    <!-- HERO CONTENT -->

    <div class="content">

        <h1>
            The Rise of the Straw Hat Crew.
        </h1>

        <p>
            The promise made in the East Blue echoes through the Grand Line.
            A journey of a thousand leagues, fueled by memories.
        </p>

        <!-- BUTTONS -->

        <div class="buttons">

            <!-- BUTTON 1 -->

            <a href="button-library.html" class="btn btn-primary">
                CONQUER THE LINE
            </a>

            <!-- BUTTON 2 -->

            <a href="treasury.html" class="btn btn-secondary">
                Enter the New World
            </a>

        </div>

    </div>

    <!-- WORKING PAGINATION -->

    <div class="pagination">

        <!-- PAGE 1 -->

        <a href="hero-page.html" class="page active">
            1
        </a>

        <!-- PAGE 2 -->

        <a href="treasury.html" class="page">
            2
        </a>

        <!-- PAGE 3 -->

        <a href="button-library.html" class="page">
            3
        </a>

        <!-- PAGE 4 -->

        <a href="css-act3.html" class="page">
            4
        </a>

         <!-- PAGE 5 -->

        <a href="last-page.html" class="page">
            5
        </a>
        
    </div>

</section>

</body>
</html>
