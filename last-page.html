<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TO BE CONTINUED</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;

    font-family:'Poppins',sans-serif;

    color:white;
}

/* BACKGROUND */

.hero{
    width:100%;
    height:100vh;

    background:
    linear-gradient(
        90deg,
        rgba(120,0,0,0.75) 0%,
        rgba(0,0,0,0.95) 55%,
        rgba(120,0,0,0.65) 100%
    ),
    url("tbc-bg.jpg") center/cover no-repeat;

    position:relative;
}

/* CONTENT */

.content{
    position:absolute;

    top:50%;
    left:50px;

    transform:translateY(-50%);

    z-index:2;

    max-width:650px;
}

/* TITLE */

.content h1{

    font-size:88px;

    line-height:0.95;

    font-weight:800;

    margin-bottom:50px;

    text-shadow:
    0 0 10px rgba(255,255,255,0.9),
    0 0 15px rgba(255,255,255,0.538),
    0 0 50px rgba(255,255,255,0.6);
}

/* SUBTEXT */

.content p{

    font-size:26px;

    line-height:1.4;

    font-weight:400;

    margin-bottom:120px;

    color:rgba(255,255,255,0.95);
}

/* BUTTON */

.btn{

    display:inline-block;

    padding:18px 40px;

    border-radius:50px;

    background:#ff1200;

    color:white;

    text-decoration:none;

    font-size:18px;

    font-weight:600;

    transition:0.35s ease;

    box-shadow:
    0 10px 30px rgba(255,0,0,0.35);
}

.btn:hover{

    transform:translateY(-4px) scale(1.03);

    background:#ff2d1d;

    box-shadow:
    0 0 25px rgba(255,0,0,0.7);
}

/* PAGINATION */

.pagination{

    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:12px;

    z-index:20;
}

/* CLICKABLE PAGE BUTTONS */

.page{

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(255,255,255,0.15);

    color:white;

    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:0.3s ease;

    backdrop-filter:blur(5px);

    text-decoration:none;
}

.page:hover{

    transform:translateY(-3px);

    background:#ff1200;
    color:white;

    box-shadow:
    0 8px 20px rgba(255,0,0,0.45);
}

/* ACTIVE PAGE = PAGE 5 */

.active{

    background:#ff1200;
    color:white;

    box-shadow:
    0 8px 20px rgba(255,0,0,0.45);
}

/* RESPONSIVE */

@media(max-width:900px){

    .content h1{
        font-size:62px;
    }

    .content p{
        font-size:20px;
    }
}

</style>
</head>

<body>

<section class="hero">

    <!-- CONTENT -->

    <div class="content">

        <h1>
            You’ve Reached<br>
            Laugh Tale.
        </h1>

        <p>
            Our journey ends here, Nakama.<br>
            The One Piece is real... and you found it.
        </p>

        <!-- BUTTON -->

        <a href="project/index.html" class="btn">
            Return to the Grand Line
        </a>

    </div>

    <!-- PAGINATION -->

    <div class="pagination">

        <!-- LOGIN PAGE -->
        <a href="project/index.html" class="page">
            L
        </a>

        <!-- PAGE 1 -->
        <a href="hero-page.html" class="page">
            1
        </a>

        <!-- PAGE 2 -->
        <a href="treasury.html" class="page">
            2
        </a>

        <!-- PAGE 3 -->
        <a href="button-library.html" class="page">
            3
        </a>

        <!-- PAGE 4 -->
        <a href="css-act3.html" class="page">
            4
        </a>

        <!-- PAGE 5 -->
        <a href="last-page.html" class="page active">
            5
        </a>

    </div>

</section>

</body>
</html>
